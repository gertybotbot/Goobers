---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: gooberrunactions.goobers.dev
spec:
  group: goobers.dev
  names:
    kind: GooberRunAction
    listKind: GooberRunActionList
    plural: gooberrunactions
    shortNames:
    - gract
    singular: gooberrunaction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.target.runName
      name: Run
      type: string
    - jsonPath: .spec.target.occurrenceSeq
      name: Occurrence
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GooberRunAction is an immutable, occurrence-bound, one-shot human
          intervention against a GooberRun.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GooberRunActionSpec is an IMMUTABLE one-shot intervention request. It is
              immutable because an action is a fact ("this actor decided this, for this
              occurrence"), not desired state: editing one in place would rewrite history.

              The conditional-requirement rules below test size() rather than comparing
              against an empty-string literal. A bare ” in a marker round-trips into a
              Unicode right double quote in the generated YAML, which then fails CEL
              compilation and makes the apiserver reject the whole CRD at install time.
              size(x) > 0 states the same requirement and survives the round trip.
            properties:
              actor:
                description: |-
                  Actor identifies the human principal that requested the intervention. It
                  is journalled verbatim for audit.
                minLength: 1
                type: string
              decision:
                description: Decision is the gate outcome selected by a GateDecision
                  action.
                type: string
              instructionAddendum:
                description: |-
                  InstructionAddendum is the one-off instruction text supplied for a
                  StageRerun.
                type: string
              kind:
                description: Kind is the intervention being requested.
                enum:
                - GateDecision
                - GateOverride
                - StageRerun
                - Cancel
                - ResumeFromTerminal
                type: string
              rationale:
                description: |-
                  Rationale explains why an operator overrode a nondeterministic gate. It
                  is required for GateOverride.
                type: string
              target:
                description: Target binds this action to an exact run UID and journal
                  occurrence.
                properties:
                  branch:
                    description: Branch is the branch the occurrence lives on (0 is
                      the root branch).
                    format: int32
                    type: integer
                  occurrenceSeq:
                    description: |-
                      OccurrenceSeq is the journal sequence of the exact pause or terminal
                      event this action answers. It is the anti-stale-click guard.
                    format: int64
                    minimum: 1
                    type: integer
                  runId:
                    description: |-
                      RunID is the canonical journal run identifier, carried for auditability
                      and cross-checked against the run's pinned spec.
                    type: string
                  runName:
                    description: RunName is the GooberRun object name in the action's
                      namespace.
                    minLength: 1
                    type: string
                  runUid:
                    description: |-
                      RunUID is the Kubernetes UID of the targeted GooberRun. A recreated CR
                      gets a fresh UID, so a queued action cannot leak across occurrences.
                    minLength: 1
                    type: string
                  stage:
                    description: |-
                      Stage names the stage or gate the occurrence belongs to. It is a
                      human-legibility cross-check, not the identity.
                    type: string
                required:
                - occurrenceSeq
                - runName
                - runUid
                type: object
              targetState:
                description: |-
                  TargetState is the workflow state a ResumeFromTerminal action reopens at,
                  or the branch a GateOverride selects. It is named distinctly from Target
                  (the occurrence binding) because the two are unrelated: one says WHICH
                  occurrence is being answered, the other says WHERE the machine should go.
                type: string
            required:
            - actor
            - kind
            - target
            type: object
            x-kubernetes-validations:
            - message: 'GooberRunAction spec is immutable: an intervention is a one-shot
                fact, not desired state'
              rule: self == oldSelf
            - message: a gate override requires a rationale
              rule: self.kind != 'GateOverride' || (has(self.rationale) && size(self.rationale)
                > 0)
            - message: a gate decision requires a decision
              rule: self.kind != 'GateDecision' || (has(self.decision) && size(self.decision)
                > 0)
            - message: a resume from terminal requires a target state
              rule: self.kind != 'ResumeFromTerminal' || (has(self.targetState) &&
                size(self.targetState) > 0)
          status:
            description: GooberRunActionStatus projects how the controller disposed
              of the action.
            properties:
              appliedSeq:
                description: |-
                  AppliedSeq is the journal sequence of the event this action produced.
                  Set iff phase is Applied; it is the idempotency receipt that stops the
                  same action being journalled twice.
                format: int64
                type: integer
              conditions:
                description: Conditions follow standard Kubernetes conventions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message is human-facing detail. It is never parsed.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the action's disposition.
                enum:
                - Pending
                - Accepted
                - Applied
                - Rejected
                type: string
              rejectionReason:
                description: RejectionReason is a stable classifier when phase is
                  Rejected.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
